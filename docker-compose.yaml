services:
  database:
    image: postgres
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  billy191-services:
    build: .
    networks:
      - default
      - shared-net
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:

networks:
  shared-net:
    name: billy-shared-network
