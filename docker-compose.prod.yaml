services:
  database:
    environment:
      POSTGRES_DB: '${PROD_DB_NAME}'
      POSTGRES_USER: '${PROD_DB_USERNAME}'
      POSTGRES_PASSWORD: '${PROD_DB_PASSWORD}'

  billy191-services:
    ports:
      - '${PROD_PORT}:${PROD_PORT}'
    environment:
      - APP_ENV=production
      - DB_HOST=database
      - DB_PORT=${PROD_DB_PORT}
      - DB_USERNAME=${PROD_DB_USERNAME}
      - DB_PASSWORD=${PROD_DB_PASSWORD}
      - DB_NAME=${PROD_DB_NAME}
      - PORT=${PROD_PORT}
